<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img"><title>Compare the first 3 months of a contract</title><rect width="1100" height="340" fill="#f6f9fb"/><text x="35" y="50" font-family="Arial" font-size="27" fill="#0e3455" font-weight="bold">Compare the first 3 months of a contract</text><rect x="35" y="100" width="245" height="133" rx="12" fill="white" stroke="#b3c9d8"/><text x="48" y="152" font-size="22" font-family="Arial" fill="#0e3455" font-weight="bold">Month 1</text><text x="48" y="191" font-size="16" font-family="Arial" fill="#597186">Setup and work</text><rect x="295" y="100" width="245" height="133" rx="12" fill="white" stroke="#b3c9d8"/><text x="308" y="152" font-size="22" font-family="Arial" fill="#0e3455" font-weight="bold">Month 2</text><text x="308" y="191" font-size="16" font-family="Arial" fill="#597186">Recurring services</text><rect x="555" y="100" width="245" height="133" rx="12" fill="white" stroke="#b3c9d8"/><text x="568" y="152" font-size="22" font-family="Arial" fill="#0e3455" font-weight="bold">Month 3</text><text x="568" y="191" font-size="16" font-family="Arial" fill="#597186">Follow-up metrics</text><rect x="815" y="100" width="245" height="133" rx="12" fill="white" stroke="#b3c9d8"/><text x="828" y="152" font-size="22" font-family="Arial" fill="#0e3455" font-weight="bold">Extras</text><text x="828" y="191" font-size="16" font-family="Arial" fill="#597186">Media and VAT</text><text x="35" y="297" font-size="16" font-family="Arial" fill="#597186">A starting price is not a full contractual estimate</text></svg>